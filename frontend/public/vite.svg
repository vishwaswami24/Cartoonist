<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#gradient)"/>
  
  <!-- Artist palette -->
  <ellipse cx="50" cy="55" rx="35" ry="25" fill="#fff" opacity="0.95"/>
  
  <!-- Paint wells -->
  <circle cx="35" cy="48" r="5" fill="#ff6b6b"/>
  <circle cx="50" cy="43" r="5" fill="#4ecdc4"/>
  <circle cx="65" cy="48" r="5" fill="#ffe66d"/>
  <circle cx="42" cy="58" r="5" fill="#95e1d3"/>
  <circle cx="58" cy="58" r="5" fill="#f38181"/>
  
  <!-- Paintbrush -->
  <g transform="rotate(-45, 50, 50)">
    <rect x="45" y="20" width="10" height="40" fill="#ffd93d" rx="2"/>
    <polygon points="45,20 50,10 55,20" fill="#6b5b95"/>
    <rect x="45" y="55" width="10" height="8" fill="#ff6b6b"/>
  </g>
</svg>
